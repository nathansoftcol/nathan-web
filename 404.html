<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada (404) | Nathan Soft</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0A2540" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/favicon.svg" />
  <link rel="preload" href="/assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/opensans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/img/logo/nathan-soft-logo-web.webp" as="image" type="image/webp" fetchpriority="high" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .err-wrap { min-height: 80vh; display:flex; align-items:center; justify-content:center; padding: 60px 20px; text-align:center; }
    .err-card { max-width: 580px; }
    .err-code { font-family:'Montserrat',sans-serif; font-weight:900; font-size: clamp(5rem, 14vw, 9rem); line-height:1; background: linear-gradient(135deg, #1366B1, #0A2540); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; margin-bottom: 8px; }
    .err-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top: 22px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand"><picture><source type="image/webp" srcset="/assets/img/logo/nathan-soft-logo-web.webp" /><img src="/assets/img/logo/nathan-soft-logo-web-400.png" alt="Nathan Soft" class="brand-logo" width="200" height="56" decoding="async" fetchpriority="high" loading="eager" /></picture></a>
    </div>
  </header>
  <main class="err-wrap">
    <div class="err-card">
      <div class="err-code">404</div>
      <h1>Página no encontrada</h1>
      <p>La URL que buscas no existe o fue movida. Te invitamos a volver al inicio o explorar nuestros servicios.</p>
      <div class="err-actions">
        <a class="btn btn-primary" href="/">Volver al inicio</a>
        <a class="btn btn-outline" href="/servicios">Ver servicios</a>
        <a class="btn btn-outline" href="/contacto">Contacto</a>
      </div>
    </div>
  </main>
</body>
</html>
